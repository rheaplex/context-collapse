<!doctype html>
<html lang="en">
  <head>

    <title>Context Collapse — Checks</title>
    <script src="./context-collapse.js"></script>
  </head>
  <body>
    <script>
      /* 10K Drop's check: the cell is half filled in two quarters, so there is no gap colour and the two tones weigh the same. */
      ContextCollapse.run({
        title: "Context Collapse — Checks",
        slug: "context-collapse-checks",
        fill: {
          kind: "check",
          shift: -22,
          cell: 12,
          dir: "n"
        }
      });
    </script>
  </body>
