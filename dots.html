<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Context Collapse — Dots</title>
    <script src="./context-collapse.js"></script>
  </head>
  <body>
    <script>
      /* 10K Drop's spot: a disc of element size centred in a larger cell, so the ground of the post shows between the dots. */
      ContextCollapse.run({
        title: "Context Collapse — Dots",
        slug: "context-collapse-dots",
        fill: {
          kind: "spot",
          shift: -26,
          cell: 14,
          element: 8,
          dir: "n"
        }
      });
    </script>
  </body>
</html>
